name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug and release APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk ProgressPal.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ProgressPal-apk
          path: |
            ProgressPal.apk
            app/build/outputs/apk/debug/app-debug.apk

      # Publishes the APK as a direct phone download:
      # https://github.com/<owner>/<repo>/releases/latest/download/ProgressPal.apk
      - name: Publish download link
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Progress Pal (latest build)
          body: Tap **ProgressPal.apk** below to download and install on your phone.
          make_latest: true
          files: ProgressPal.apk
