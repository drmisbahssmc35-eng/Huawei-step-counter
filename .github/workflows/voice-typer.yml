name: Build Voice Typer APK

on:
  push:
    paths:
      - "voice-typer/**"
      - ".github/workflows/voice-typer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voice-typer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk ../VoiceTyper.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceTyper-apk
          path: VoiceTyper.apk

      # Direct phone download:
      # https://github.com/<owner>/<repo>/releases/download/voice-typer-apk/VoiceTyper.apk
      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: voice-typer-apk
          target_commitish: ${{ github.sha }}
          name: Voice Typer (latest build)
          body: Tap **VoiceTyper.apk** below to download and install on your phone.
          make_latest: false
          files: VoiceTyper.apk
